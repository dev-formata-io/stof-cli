# Publishes stof-cli to crates.io. The release workflow (release.yml, generated by dist) calls this after the
# GitHub Release is up, granting id-token: write (dist-workspace.toml) for trusted publishing; no token secret.
name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        run: v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2); if curl -sf -A "stof-cli-release" "https://crates.io/api/v1/crates/stof-cli/$v" > /dev/null; then echo "stof-cli $v is already on crates.io"; else cargo publish --locked; fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
